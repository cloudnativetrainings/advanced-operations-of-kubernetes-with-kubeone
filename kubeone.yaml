apiVersion: kubeone.k8c.io/v1beta2
kind: KubeOneCluster
versions:
  kubernetes: "1.36.4" # <= the kubernetes version we will install
cloudProvider:
  gce: {} # <= we will make use of gcp resources
  external: true # <= deploy the external CCM
  cloudConfig:
    | # <= cloud provider specific configuration, will be in `/etc/kubernetes/cloud-config` on each node
    [global]
    regional = true
    multi-zone = true
    token-url = "nil"

# cloud config for GCE
# regional = true <= resources will be spread across zones of region
# multi-zone = true <= CCM is allowed to manage resources across zones
# token-url = "nil" <= workaround for gcp to make use of the secret `kubeone-ccm-credentials` instead of asking metadata-server

helmReleases:
  - releaseName: ingress-nginx
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    namespace: ingress-nginx
    version: 4.12.2
    values:
      - inline:
          controller:
            replicaCount: 2
            autoscaling:
              enabled: true
              minReplicas: 2
              maxReplicas: 5
              targetCPUUtilizationPercentage: 80
              targetMemoryUtilizationPercentage: 80
  - releaseName: cert-manager
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    namespace: cert-manager
    version: v1.17.2
    values:
      - inline:
          crds:
            enabled: true

addons:
  enable: true
  addons:    
    - name: cluster-autoscaler
